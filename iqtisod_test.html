<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iqtisod Fani — Test Platformasi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5f0e8;
    --white: #ffffff;
    --gray: #8a8a8a;
    --light: #f0ece3;
    --correct: #2d7a4f;
    --wrong: #a82020;
    --shadow: 0 8px 40px rgba(10,22,40,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--navy);
    color: var(--navy);
    min-height: 100vh;
  }

  /* === WELCOME SCREEN === */
  #welcome-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0a1628 60%, #1a2e50 100%);
    padding: 40px 20px;
    text-align: center;
  }
  .badge {
    background: var(--gold);
    color: var(--navy);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 20px;
    border-radius: 20px;
    margin-bottom: 22px;
    display: inline-block;
  }
  .welcome-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 52px);
    color: var(--white);
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .welcome-subtitle {
    font-size: 15px;
    color: var(--gold-light);
    letter-spacing: 1px;
    margin-bottom: 36px;
    font-weight: 300;
  }
  .author-tag {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 40px;
    font-style: italic;
  }
  .variant-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 520px;
    width: 100%;
    margin: 0 auto 20px;
  }
  .variant-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(201,168,76,0.35);
    color: var(--white);
    padding: 22px 16px;
    border-radius: 14px;
    font-size: 15px;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.3px;
  }
  .variant-btn:hover {
    background: var(--gold);
    color: var(--navy);
    border-color: var(--gold);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(201,168,76,0.3);
  }
  .variant-btn .vnum {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
  }
  .variant-btn .vlabel { font-size: 12px; opacity: 0.7; font-weight: 400; }
  .variant-btn:hover .vlabel { opacity: 0.9; }
  .info-row {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .info-chip {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.5px;
  }

  /* === QUIZ SCREEN === */
  #quiz-screen { display: none; min-height: 100vh; background: var(--light); }

  /* Header */
  .quiz-header {
    background: var(--navy);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 18px rgba(0,0,0,0.25);
  }
  .quiz-header-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    background: none;
    border: 1.5px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.7);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--gold); }
  .quiz-title-sm {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    color: var(--white);
  }
  .variant-badge {
    background: var(--gold);
    color: var(--navy);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 1.5px;
  }
  .quiz-stats {
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 18px; font-weight: 700; color: var(--gold-light); line-height: 1; }
  .stat-lbl { font-size: 10px; color: rgba(255,255,255,0.45); letter-spacing: 1px; }

  /* Section tabs */
  .section-tabs {
    background: var(--navy);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    overflow-x: auto;
    padding: 0 20px;
    gap: 4px;
    scrollbar-width: none;
  }
  .section-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    padding: 12px 18px;
    font-size: 12px;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    letter-spacing: 0.8px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab-btn:hover:not(.active) { color: rgba(255,255,255,0.7); }

  /* Progress bar */
  .progress-bar-wrap {
    background: rgba(0,0,0,0.08);
    height: 4px;
  }
  .progress-bar-fill {
    height: 4px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width 0.4s;
  }

  /* Questions */
  .questions-container {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  .section-heading {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--navy);
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--gold);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-heading .sec-num {
    background: var(--navy);
    color: var(--gold);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .question-card {
    background: var(--white);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 16px rgba(10,22,40,0.08);
    border: 1.5px solid transparent;
    transition: border-color 0.2s;
  }
  .question-card.answered-correct { border-color: var(--correct); }
  .question-card.answered-wrong { border-color: var(--wrong); }

  .q-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
  .q-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--gray);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    margin-top: 2px;
    min-width: 42px;
  }
  .q-text { font-size: 15px; color: var(--navy); font-weight: 600; line-height: 1.5; }

  .options-grid { display: flex; flex-direction: column; gap: 9px; padding-left: 56px; }
  .option-btn {
    background: var(--light);
    border: 1.5px solid #ddd8cc;
    color: var(--navy);
    padding: 11px 16px;
    border-radius: 10px;
    text-align: left;
    font-size: 14px;
    font-family: 'Source Sans 3', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) {
    background: #e8e3d8;
    border-color: var(--gold);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct {
    background: #d4edda;
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 600;
  }
  .option-btn.wrong {
    background: #f8d7da;
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .opt-letter {
    font-weight: 700;
    font-size: 12px;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    background: rgba(10,22,40,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0;
  }
  .option-btn.correct .opt-letter { background: var(--correct); color: white; }
  .option-btn.wrong .opt-letter { background: var(--wrong); color: white; }

  .q-feedback {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  .q-feedback.show { display: block; }
  .q-feedback.correct-fb { background: #d4edda; color: var(--correct); }
  .q-feedback.wrong-fb { background: #f8d7da; color: var(--wrong); }

  /* Results section */
  .result-panel {
    background: var(--white);
    border-radius: 18px;
    padding: 32px;
    margin: 32px 0;
    text-align: center;
    box-shadow: var(--shadow);
    display: none;
  }
  .result-panel.show { display: block; }
  .result-score-big {
    font-family: 'Playfair Display', serif;
    font-size: 64px;
    font-weight: 900;
    color: var(--navy);
    line-height: 1;
  }
  .result-score-big span { color: var(--gold); }
  .result-label { font-size: 16px; color: var(--gray); margin: 8px 0 24px; }
  .result-grade {
    display: inline-block;
    padding: 8px 28px;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 22px;
  }
  .grade-5 { background: #d4edda; color: var(--correct); }
  .grade-4 { background: #d1ecf1; color: #0c5460; }
  .grade-3 { background: #fff3cd; color: #856404; }
  .grade-2 { background: #f8d7da; color: var(--wrong); }
  .result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .retry-btn, .home-btn {
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Source Sans 3', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
  }
  .retry-btn { background: var(--navy); color: var(--white); }
  .retry-btn:hover { background: #1a2e50; transform: translateY(-2px); }
  .home-btn { background: var(--light); color: var(--navy); border: 1.5px solid #ddd; }
  .home-btn:hover { background: #e8e3d8; }

  .submit-section {
    text-align: center;
    padding: 24px 0 10px;
  }
  .submit-btn {
    background: var(--gold);
    color: var(--navy);
    border: none;
    padding: 15px 48px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Source Sans 3', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .submit-btn:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.35); }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 600px) {
    .options-grid { padding-left: 0; }
    .q-header { flex-direction: column; gap: 6px; }
    .quiz-stats { gap: 12px; }
    .variant-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- WELCOME SCREEN -->
<div id="welcome-screen">
  <div class="badge">O'quv Testi Platformasi</div>
  <h1 class="welcome-title">Iqtisodiyot Fani<br>Test Savollari</h1>
  <p class="welcome-subtitle">Ishlab chiqarishni tashkil etish va rejalashtirish</p>
  <p class="author-tag">Tuzuvchi: A.Normamatov</p>

  <div class="variant-grid">

  </div>
  <div class="info-row">

</div>

<!-- QUIZ SCREEN -->
<div id="quiz-screen">

  </div>

  <div class="section-tabs" id="section-tabs"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div class="questions-container" id="questions-container"></div>
</div>

// Seeds for variants (different shuffles)
const VARIANT_SEEDS = [42, 137, 256, 911];

// Seeded random
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return (s >>> 0) / 4294967296;
  };
}

function shuffleWithSeed(arr, seed) {
  const rand = seededRandom(seed);
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const SECTION_NAMES = {
  1: "Fan asoslari",
  2: "Korxona tuzilmasi",
  3: "Ishlab chiqarish turlari",
  4: "Nazorat va rejalashtirish"
};

let currentVariant = 1;
let variantQuestions = [];
let answeredCount = 0;
let correctCount = 0;
let totalQ = 0;

function startQuiz(variant) {
  currentVariant = variant;
  answeredCount = 0;
  correctCount = 0;

  // Shuffle questions by section using variant seed
  const seed = VARIANT_SEEDS[variant - 1];
  const rand = seededRandom(seed * 7);

  // For each section pick questions and shuffle options
  const bySection = {1:[], 2:[], 3:[], 4:[]};
  ALL_QUESTIONS.forEach(q => bySection[q.section].push(q));

  variantQuestions = [];
  [1,2,3,4].forEach(sec => {
    // Shuffle questions within section
    let qs = shuffleWithSeed(bySection[sec], seed + sec * 13);
    // Take some (up to available)
    qs = qs.slice(0, Math.min(qs.length, 7));
    qs.forEach(q => variantQuestions.push({...q, section: sec}));
  });

  totalQ = variantQuestions.length;

  document.getElementById('vbadge').textContent = ['I','II','III','IV'][variant-1] + '-VARIANT';
  document.getElementById('stat-total').textContent = totalQ;
  document.getElementById('stat-answered').textContent = 0;
  document.getElementById('stat-correct').textContent = 0;

  buildTabs();
  buildQuestions(seed);
  updateProgress();

  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  window.scrollTo(0,0);
}

function buildTabs() {
  const tabsEl = document.getElementById('section-tabs');
  tabsEl.innerHTML = '';
  [1,2,3,4].forEach(sec => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (sec === 1 ? ' active' : '');
    btn.textContent = sec + '. ' + SECTION_NAMES[sec];
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const el = document.getElementById('section-' + sec);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    };
    tabsEl.appendChild(btn);
  });
}

function buildQuestions(seed) {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  let qNum = 1;
  [1,2,3,4].forEach(sec => {
    const secQs = variantQuestions.filter(q => q.section === sec);
    if (!secQs.length) return;

    const secDiv = document.createElement('div');
    secDiv.id = 'section-' + sec;

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.innerHTML = `<span class="sec-num">${sec}</span>${SECTION_NAMES[sec]}`;
    secDiv.appendChild(heading);

    secQs.forEach((q, idx) => {
      const globalIdx = variantQuestions.indexOf(q);
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'qcard-' + globalIdx;

      // Shuffle options
      const allOptions = [q.correct, ...q.wrong];
      const shuffled = shuffleWithSeed(allOptions, seed + globalIdx * 31 + sec * 7);

      const letters = ['A', 'B', 'C', 'D'];
      const optHtml = shuffled.map((opt, i) =>
        `<button class="option-btn" onclick="selectOption(${globalIdx}, this, ${opt === q.correct})">
          <span class="opt-letter">${letters[i]}</span>${opt}
        </button>`
      ).join('');

      card.innerHTML = `
        <div class="q-header">
          <span class="q-num">S-${qNum}</span>
          <span class="q-text">${q.q}</span>
        </div>
        <div class="options-grid">${optHtml}</div>
        <div class="q-feedback" id="fb-${globalIdx}"></div>
      `;
      secDiv.appendChild(card);
      qNum++;
    });

    container.appendChild(secDiv);
  });

  // Submit + result
  const submitSec = document.createElement('div');
  submitSec.className = 'submit-section';
  submitSec.innerHTML = `<button class="submit-btn" id="submit-btn" onclick="showResults()">Natijani ko'rish</button>`;
  container.appendChild(submitSec);

  const resultPanel = document.createElement('div');
  resultPanel.className = 'result-panel';
  resultPanel.id = 'result-panel';
  container.appendChild(resultPanel);
}

function selectOption(qIdx, btn, isCorrect) {
  const card = document.getElementById('qcard-' + qIdx);
  if (card.classList.contains('answered-correct') || card.classList.contains('answered-wrong')) return;

  // Disable all buttons in this card
  card.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b === btn) {
      b.classList.add(isCorrect ? 'correct' : 'wrong');
    }
    // Show correct answer
    if (!isCorrect) {
      const q = variantQuestions[qIdx];
      if (b.textContent.trim().endsWith(q.correct) || b.innerHTML.includes(q.correct)) {
        // find correct btn
      }
    }
  });

  // Highlight correct answer always
  if (!isCorrect) {
    card.querySelectorAll('.option-btn').forEach(b => {
      const q = variantQuestions[qIdx];
      if (b.innerText.includes(q.correct)) {
        b.classList.add('correct');
      }
    });
  }

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  const fb = document.getElementById('fb-' + qIdx);
  if (isCorrect) {
    fb.className = 'q-feedback correct-fb show';
    fb.textContent = '✓ To\'g\'ri javob!';
    correctCount++;
  } else {
    fb.className = 'q-feedback wrong-fb show';
    fb.textContent = '✗ Noto\'g\'ri. To\'g\'ri javob yuqorida yashil rangda ko\'rsatildi.';
  }

  answeredCount++;
  document.getElementById('stat-answered').textContent = answeredCount;
  document.getElementById('stat-correct').textContent = correctCount;
  updateProgress();
}

function updateProgress() {
  const pct = totalQ > 0 ? (answeredCount / totalQ) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function showResults() {
  const panel = document.getElementById('result-panel');
  panel.classList.add('show');

  const pct = Math.round((correctCount / totalQ) * 100);
  let grade, gradeClass, msg;
  if (pct >= 86) { grade = "5 (A'lo)"; gradeClass = "grade-5"; msg = "Ajoyib natija! 🎉"; }
  else if (pct >= 71) { grade = "4 (Yaxshi)"; gradeClass = "grade-4"; msg = "Yaxshi natija! 👍"; }
  else if (pct >= 56) { grade = "3 (Qoniqarli)"; gradeClass = "grade-3"; msg = "Yaxshilanish kerak!"; }
  else { grade = "2 (Qoniqarsiz)"; gradeClass = "grade-2"; msg = "Ko'proq o'qish kerak!"; }

  panel.innerHTML = `
    <div class="result-score-big">${correctCount}<span>/${totalQ}</span></div>
    <div class="result-label">${pct}% to'g'ri javoblar · ${msg}</div>
    <div class="result-grade ${gradeClass}">${grade}</div>
    <p style="color:#888; font-size:13px; margin-bottom:22px;">
      To'g'ri: ${correctCount} · Noto'g'ri: ${totalQ - correctCount} · Javob berilmagan: ${totalQ - answeredCount}
    </p>
    <div class="result-btns">
      <button class="retry-btn" onclick="startQuiz(${currentVariant})">🔄 Qaytadan urinish</button>
      <button class="home-btn" onclick="goHome()">🏠 Bosh sahifa</button>
    </div>
  `;
  panel.scrollIntoView({behavior:'smooth'});
}

function goHome() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('welcome-screen').style.display = 'flex';
  window.scrollTo(0,0);
}
